<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wadan Roster</title>
  <meta name="theme-color" content="#7B1C1C">
  <meta name="description" content="Dhol Tasha performance roster, teams, and reminders for Ganesh Utsav">

  <!-- Installable web app -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

  <!-- iOS: "Add to Home Screen" uses these instead of the manifest -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Wadan Roster">
  <meta name="mobile-web-app-capable" content="yes">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Mukta:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css?v=202609182247">
</head>
<body>
  <div id="app"></div>
  <script src="app.js?v=202609182247"></script>
  <script>
    // One-time cleanup: unregister the old caching service worker (it was making
    // updates slow to show up) and clear anything it cached. Safe to run on every
    // visit — becomes a no-op once nothing is registered.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.unregister()));
    }
    if (window.caches) {
      caches.keys().then(keys => keys.forEach(k => caches.delete(k)));
    }
  </script>
</body>
</html>
